<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - FoodNest</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background:linear-gradient(180deg, #fff7ed 0%, #f8fafc 100%);">
  <header class="topbar">
    <div class="container header-inner">
      <a href="index.html" class="brand-wordmark">
        <div class="brand-badge">FN</div>
        <span>FoodNest</span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="restaurants.html">Restaurants</a>
        <a href="smartbite.html">SmartBite</a>
      </nav>
      <div class="header-actions">
        <a href="signup.html" class="btn btn-sm btn-primary">Create Account</a>
      </div>
    </div>
  </header>

  <main class="container" style="display:flex; justify-content:center; align-items:center; padding:64px 20px;">
    <div class="card" style="width:100%; max-width:440px; padding:36px; background:white;">
      <h1 style="font-size:1.8rem; margin-bottom:8px; text-align:center;">Welcome Back</h1>
      <p style="text-align:center; color:var(--text-muted); font-size:0.9rem; margin-bottom:28px;">
        Sign in to your FoodNest account
      </p>

      <form id="login-form">
        <div style="margin-bottom:16px;">
          <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:6px;">Email Address</label>
          <input type="email" id="login-email" required placeholder="you@example.com" value="customer@foodnest.com" style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-family:inherit;">
        </div>

        <div style="margin-bottom:24px;">
          <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:6px;">Password</label>
          <input type="password" id="login-password" required placeholder="••••••••" value="Customer@12345" style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-family:inherit;">
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width:100%; padding:12px;">Sign In</button>
      </form>

      <div style="margin-top:24px; padding-top:16px; border-top:1px solid var(--border); text-align:center; font-size:0.85rem; color:var(--text-muted);">
        Don't have an account? <a href="signup.html" style="color:var(--primary); font-weight:600; text-decoration:none;">Sign Up</a>
      </div>

      <!-- Quick Fill Credentials for Lab Evaluator -->
      <div style="margin-top:20px; background:#f8fafc; border:1px dashed var(--border); border-radius:10px; padding:12px; font-size:0.8rem;">
        <span style="font-weight:700; color:var(--charcoal); display:block; margin-bottom:4px;">Lab Demo Test Accounts:</span>
        <div><strong>Admin:</strong> admin@foodnest.com / Admin@12345</div>
        <div><strong>Customer:</strong> customer@foodnest.com / Customer@12345</div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('login-submit-btn');

      btn.disabled = true;
      btn.textContent = 'Verifying credentials...';

      try {
        const res = await api.login(email, password);
        api.setAuth(res.token, res.user);
        showToast(`Welcome back, ${res.user.name}!`, 'success');

        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect') || (res.user.role === 'ADMIN' ? 'admin.html' : 'index.html');
        setTimeout(() => window.location.href = redirect, 600);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Sign In';
        showToast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
