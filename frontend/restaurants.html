<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurants - FoodNest</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="container header-inner">
      <a href="index.html" class="brand-wordmark">
        <div class="brand-badge">FN</div>
        <span>FoodNest</span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="restaurants.html" class="active">Restaurants</a>
        <a href="smartbite.html">SmartBite</a>
        <a href="orders.html">My Orders</a>
      </nav>
      <div class="header-actions">
        <a href="cart.html" class="cart-trigger" aria-label="Shopping Cart">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4H6zM3 6h18M16 10a4 4 0 01-8 0"/></svg>
          <span class="cart-count" style="display:none;">0</span>
        </a>
        <div id="user-nav-actions"></div>
      </div>
    </div>
  </header>

  <main class="container" style="padding: 36px 24px 64px;">
    <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:28px; flex-wrap:wrap; gap:16px;">
      <div>
        <h1 style="font-size:2.2rem;">All Restaurants</h1>
        <p style="color:var(--text-muted); font-size:0.95rem;">Browse partner restaurants delivering fresh to your doorstep</p>
      </div>

      <!-- Filters Strip -->
      <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
        <input type="text" id="rest-search" placeholder="Search by name..." style="padding:8px 14px; border:1px solid var(--border); border-radius:8px; font-family:inherit; font-size:0.9rem;">
        <select id="cuisine-filter" style="padding:8px 14px; border:1px solid var(--border); border-radius:8px; font-family:inherit; font-size:0.9rem; background:white;">
          <option value="">All Cuisines</option>
          <option value="Biryani">Biryani</option>
          <option value="North Indian">North Indian</option>
          <option value="South Indian">South Indian</option>
          <option value="Pizza">Pizza</option>
          <option value="Chinese">Chinese</option>
          <option value="Burgers">Burgers</option>
          <option value="Desserts">Desserts</option>
          <option value="Healthy Food">Healthy Food</option>
        </select>
        <select id="rating-filter" style="padding:8px 14px; border:1px solid var(--border); border-radius:8px; font-family:inherit; font-size:0.9rem; background:white;">
          <option value="">Any Rating</option>
          <option value="4.5">★ 4.5 & above</option>
          <option value="4.0">★ 4.0 & above</option>
        </select>
        <button id="apply-filters-btn" class="btn btn-primary btn-sm">Filter</button>
        <button id="reset-filters-btn" class="btn btn-secondary btn-sm">Reset</button>
      </div>
    </div>

    <!-- Restaurant Grid -->
    <div id="restaurants-grid" class="grid-3">
      <div style="grid-column:1/-1; text-align:center; padding:48px; color:var(--text-muted);">
        Loading restaurants...
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    async function loadRestaurants() {
      const grid = document.getElementById('restaurants-grid');
      const params = new URLSearchParams(window.location.search);
      const search = params.get('search') || document.getElementById('rest-search').value.trim();
      const cuisine = params.get('cuisine') || document.getElementById('cuisine-filter').value;
      const minRating = document.getElementById('rating-filter').value;

      if (search) document.getElementById('rest-search').value = search;
      if (cuisine) document.getElementById('cuisine-filter').value = cuisine;

      const filterParams = {};
      if (search) filterParams.search = search;
      if (cuisine) filterParams.cuisine = cuisine;
      if (minRating) filterParams.minRating = minRating;

      try {
        const list = await api.getRestaurants(filterParams);
        if (!list || list.length === 0) {
          grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:60px; color:var(--text-muted);">No restaurants found matching your criteria.</div>';
          return;
        }

        grid.innerHTML = list.map(r => `
          <div class="card restaurant-card" onclick="location.href='menu.html?id=${r.id}'" style="cursor:pointer;">
            <div class="image-wrapper">
              <img src="${r.imageUrl}" alt="${r.name}" onerror="this.src='https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=800'">
            </div>
            <div class="card-body">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="font-size:1.2rem;">${r.name}</h3>
                <span style="font-weight:700; color:#15803d; font-size:0.9rem;" class="tabular">★ ${r.rating}</span>
              </div>
              <p style="font-size:0.86rem; color:var(--text-muted); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">${r.description}</p>
              <div class="metadata-line" style="margin-top:auto; padding-top:8px; border-top:1px solid #f1f5f9;">
                <span>⏱ ${r.deliveryEstimateMinutes} mins</span>
                <span class="metadata-sep">·</span>
                <span>${r.cuisineTypes ? r.cuisineTypes.slice(0, 2).join(', ') : 'Speciality'}</span>
                <span class="metadata-sep">·</span>
                <span>${r.addressCity || 'Bengaluru'}</span>
              </div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:48px; color:#dc2626;">Could not fetch restaurants from backend. Please check server.</div>';
      }
    }

    document.getElementById('apply-filters-btn').addEventListener('click', loadRestaurants);
    document.getElementById('reset-filters-btn').addEventListener('click', () => {
      document.getElementById('rest-search').value = '';
      document.getElementById('cuisine-filter').value = '';
      document.getElementById('rating-filter').value = '';
      window.history.replaceState({}, '', 'restaurants.html');
      loadRestaurants();
    });

    document.addEventListener('DOMContentLoaded', loadRestaurants);
  </script>
</body>
</html>
