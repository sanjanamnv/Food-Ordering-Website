<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - FoodNest</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background:linear-gradient(180deg, #fff7ed 0%, #f8fafc 100%);">
  <header class="topbar">
    <div class="container header-inner">
      <a href="index.html" class="brand-wordmark">
        <div class="brand-badge">FN</div>
        <span>FoodNest</span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="restaurants.html">Restaurants</a>
        <a href="smartbite.html">SmartBite</a>
      </nav>
      <div class="header-actions">
        <a href="login.html" class="btn btn-sm btn-secondary">Sign In</a>
      </div>
    </div>
  </header>

  <main class="container" style="display:flex; justify-content:center; align-items:center; padding:48px 20px;">
    <div class="card" style="width:100%; max-width:480px; padding:36px; background:white;">
      <h1 style="font-size:1.8rem; margin-bottom:8px; text-align:center;">Join FoodNest</h1>
      <p style="text-align:center; color:var(--text-muted); font-size:0.9rem; margin-bottom:28px;">
        Register your account with BCrypt password hashing & MongoDB persistence
      </p>

      <form id="signup-form">
        <div style="margin-bottom:14px;">
          <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:4px;">Full Name *</label>
          <input type="text" id="reg-name" required placeholder="e.g. Sanjana Rao" style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-family:inherit;">
        </div>

        <div style="margin-bottom:14px;">
          <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:4px;">Email Address *</label>
          <input type="email" id="reg-email" required placeholder="name@example.com" style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-family:inherit;">
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom:14px;">
          <div>
            <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:4px;">Password *</label>
            <input type="password" id="reg-pass" required minlength="6" placeholder="Min 6 chars" style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-family:inherit;">
          </div>
          <div>
            <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:4px;">Confirm Password *</label>
            <input type="password" id="reg-confirm" required minlength="6" placeholder="Re-enter password" style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-family:inherit;">
          </div>
        </div>

        <div style="margin-bottom:14px;">
          <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:4px;">Mobile Phone</label>
          <input type="tel" id="reg-phone" placeholder="+91 9876543210" style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-family:inherit;">
        </div>

        <div style="margin-bottom:20px;">
          <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:4px;">Default City</label>
          <input type="text" id="reg-city" placeholder="Bengaluru" value="Bengaluru" style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-family:inherit;">
        </div>

        <button type="submit" id="reg-submit-btn" class="btn btn-primary" style="width:100%; padding:12px;">Create Account</button>
      </form>

      <div style="margin-top:24px; padding-top:16px; border-top:1px solid var(--border); text-align:center; font-size:0.85rem; color:var(--text-muted);">
        Already have an account? <a href="login.html" style="color:var(--primary); font-weight:600; text-decoration:none;">Sign In</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-pass').value;
      const confirmPassword = document.getElementById('reg-confirm').value;
      const phone = document.getElementById('reg-phone').value.trim();
      const city = document.getElementById('reg-city').value.trim();
      const btn = document.getElementById('reg-submit-btn');

      if (password !== confirmPassword) {
        showToast('Passwords do not match', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Registering user...';

      try {
        const res = await api.register({
          name, email, password, confirmPassword, phone, city,
          street: 'Main Road', state: 'Karnataka', pincode: '560001'
        });
        api.setAuth(res.token, res.user);
        showToast('Account created successfully!', 'success');
        setTimeout(() => window.location.href = 'index.html', 700);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Create Account';
        showToast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
