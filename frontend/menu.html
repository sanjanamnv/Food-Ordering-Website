<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu - FoodNest</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="container header-inner">
      <a href="index.html" class="brand-wordmark">
        <div class="brand-badge">FN</div>
        <span>FoodNest</span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="restaurants.html" class="active">Restaurants</a>
        <a href="smartbite.html">SmartBite</a>
        <a href="orders.html">My Orders</a>
      </nav>
      <div class="header-actions">
        <a href="cart.html" class="cart-trigger" aria-label="Shopping Cart">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4H6zM3 6h18M16 10a4 4 0 01-8 0"/></svg>
          <span class="cart-count" style="display:none;">0</span>
        </a>
        <div id="user-nav-actions"></div>
      </div>
    </div>
  </header>

  <main class="container" style="padding: 32px 24px 64px;">
    <!-- Restaurant Header Card -->
    <div id="restaurant-header" class="card" style="padding:28px; margin-bottom:32px; display:flex; gap:32px; align-items:center; flex-wrap:wrap;">
      <div style="flex:1; min-width:280px;">
        <span style="color:var(--primary); font-size:0.85rem; font-weight:700;">★ PARTNER RESTAURANT</span>
        <h1 id="rest-name" style="font-size:2.2rem; margin:6px 0 8px;">Loading Restaurant...</h1>
        <p id="rest-desc" style="color:var(--text-muted); font-size:0.95rem; margin-bottom:14px; max-width:650px;"></p>
        <div class="metadata-line">
          <span id="rest-rating" style="font-weight:700; color:#15803d;">★ 4.8</span>
          <span class="metadata-sep">·</span>
          <span id="rest-delivery">⏱ 30 mins</span>
          <span class="metadata-sep">·</span>
          <span id="rest-cuisines">Indian</span>
          <span class="metadata-sep">·</span>
          <span id="rest-city">Bengaluru</span>
        </div>
      </div>
      <div style="width:220px; height:150px; border-radius:12px; overflow:hidden;">
        <img id="rest-img" src="" alt="Restaurant" style="width:100%; height:100%; object-fit:cover;">
      </div>
    </div>

    <!-- Menu Controls & Veg Toggle -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:16px;">
      <div>
        <h2 style="font-size:1.5rem;">Recommended Menu Dishes</h2>
        <p style="color:var(--text-muted); font-size:0.9rem;">Freshly prepared delicacies made with authentic recipes</p>
      </div>

      <div style="display:flex; gap:16px; align-items:center;">
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:0.9rem; font-weight:600;">
          <input type="checkbox" id="veg-toggle" style="accent-color:#16a34a; width:18px; height:18px;">
          <span class="veg-indicator"></span> Veg Only
        </label>
        <input type="text" id="menu-search" placeholder="Search dish in menu..." style="padding:8px 14px; border:1px solid var(--border); border-radius:8px; font-family:inherit; font-size:0.9rem;">
      </div>
    </div>

    <!-- Food Items Grid -->
    <div id="food-grid" class="grid-3">
      <div style="grid-column:1/-1; text-align:center; padding:48px; color:var(--text-muted);">
        Loading restaurant menu items...
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    let allMenuItems = [];
    const params = new URLSearchParams(window.location.search);
    const restId = params.get('id');

    async function loadMenu() {
      if (!restId) {
        window.location.href = 'restaurants.html';
        return;
      }

      try {
        const [restaurant, menu] = await Promise.all([
          api.getRestaurantById(restId),
          api.getRestaurantMenu(restId)
        ]);

        // Render header
        document.getElementById('rest-name').textContent = restaurant.name;
        document.getElementById('rest-desc').textContent = restaurant.description;
        document.getElementById('rest-rating').textContent = `★ ${restaurant.rating}`;
        document.getElementById('rest-delivery').textContent = `⏱ ${restaurant.deliveryEstimateMinutes} mins`;
        document.getElementById('rest-cuisines').textContent = restaurant.cuisineTypes ? restaurant.cuisineTypes.join(', ') : 'Specialities';
        document.getElementById('rest-city').textContent = restaurant.addressCity || 'Bengaluru';
        document.getElementById('rest-img').src = restaurant.imageUrl || 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=800';

        allMenuItems = menu || [];
        renderMenu();
      } catch (err) {
        document.getElementById('food-grid').innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:48px; color:#dc2626;">Error loading restaurant menu.</div>';
      }
    }

    function renderMenu() {
      const grid = document.getElementById('food-grid');
      const vegOnly = document.getElementById('veg-toggle').checked;
      const search = document.getElementById('menu-search').value.toLowerCase().trim();

      const filtered = allMenuItems.filter(item => {
        if (vegOnly && !item.vegetarian) return false;
        if (search && !item.name.toLowerCase().includes(search) && !item.description?.toLowerCase().includes(search)) return false;
        return true;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:48px; color:var(--text-muted);">No dishes match your selected filter.</div>';
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <div class="card food-card">
          <div class="food-img-wrap">
            <img src="${item.imageUrl}" alt="${item.name}" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=800'">
          </div>
          <div class="food-body">
            <div>
              <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px;">
                <h3 style="font-size:1.15rem;">${item.name}</h3>
                <span class="${item.vegetarian ? 'veg-indicator' : 'non-veg-indicator'}" title="${item.vegetarian ? 'Vegetarian' : 'Non-Vegetarian'}"></span>
              </div>
              <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:12px; line-height:1.4;">${item.description}</p>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px; border-top:1px solid #f1f5f9; padding-top:12px;">
              <span style="font-size:1.2rem; font-weight:800; color:var(--charcoal);" class="tabular">₹${item.price}</span>
              ${item.available
                ? `<button class="btn btn-primary btn-sm" onclick='addToCart(${JSON.stringify(item).replace(/'/g, "&#39;")})'>Add to Cart</button>`
                : `<span style="font-size:0.8rem; color:#dc2626; font-weight:600;">Out of Stock</span>`
              }
            </div>
          </div>
        </div>
      `).join('');
    }

    window.addToCart = (item) => {
      cart.addItem(item, 1);
    };

    document.getElementById('veg-toggle').addEventListener('change', renderMenu);
    document.getElementById('menu-search').addEventListener('input', renderMenu);
    document.addEventListener('DOMContentLoaded', loadMenu);
  </script>
</body>
</html>
